[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lenny-growth-backend"
version = "0.1.0"
description = "FastAPI backend for The Lenny Growth Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.5",
    "httpx>=0.27.0",
    "python-json-logger>=2.0.7",
    "pyyaml>=6.0.1",
    "anthropic>=0.20.0",
    "openai>=1.14.0",
    "groq>=0.5.0",
    "bleach>=6.1.0",
    "markdown>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
