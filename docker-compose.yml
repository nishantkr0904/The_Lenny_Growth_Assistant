services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lenny_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lenny_growth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${HOST_PORT_POSTGRES:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lenny_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_growth"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: lenny_ollama
    restart: unless-stopped
    ports:
      - "${HOST_PORT_OLLAMA:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - lenny_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lenny_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/lenny_growth
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_PROVIDER=ollama
    ports:
      - "${HOST_PORT_BACKEND:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - lenny_internal

networks:
  lenny_internal:
    name: lenny_internal
    driver: bridge

volumes:
  postgres_data:
    name: lenny_postgres_data
  ollama_data:
    name: lenny_ollama_data
